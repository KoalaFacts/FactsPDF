<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-size: 12pt; color: #253047; }
    .report { width: 140mm; padding: 5mm; border: 0.25mm solid #23446b; background: #f0f6fa; }
    h1 { font-size: 18pt; text-transform: uppercase; }
    p { margin-bottom: 4mm; }
    p.reference { white-space: nowrap; text-transform: uppercase; }
    p.status { text-transform: lowercase; }
    p.owner { text-transform: uppercase; }
    span.proper { text-transform: none; }
  </style>
</head>
<body>
  <section class="report">
    <h1>Service status report</h1>
    <p class="reference">Reference: inv-2026-1042</p>
    <p class="status">STATUS: PENDING REVIEW</p>
    <p class="owner">Assigned to <span class="proper">Example Facilities Pty Ltd</span></p>
  </section>
</body>
</html>
