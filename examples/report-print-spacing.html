<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-size: 11pt; color: #253047; }
    .report {
      width: 140mm;
      padding: 5mm;
      border: 0.25mm solid #23446b;
      background: #f0f6fa;
    }
    h1 { font-size: 18pt; margin: 0 3mm 5mm 5mm; color: #23446b; }
    p { margin: 0 3mm 3mm 5mm; line-height: 1.3; }
    p.previous-estimate { text-decoration: line-through; }
    p.revised-estimate { text-decoration-line: underline; }
    p.summary-badge {
      width: 70%;
      margin: 4mm auto 3mm;
      padding: 2mm;
      border: 0.25mm solid #23446b;
      background: #dbeaf0;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="report">
    <h1>Service &amp; Maintenance Report</h1>
    <p>Client: Example Facilities Pty Ltd</p>
    <p>Location: Suite 2 / Chatswood</p>
    <p>Inspection: Equipment seals and safety checks complete.</p>
    <p>Outcome: Two items require follow-up.</p>
    <p class="previous-estimate">Previous estimate: AUD 3,200.00</p>
    <p class="revised-estimate">Revised estimate: AUD 2,980.00</p>
    <p class="summary-badge">Follow-up: 2 items scheduled for review.</p>
  </section>
</body>
</html>
