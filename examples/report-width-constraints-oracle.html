<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-size: 11pt; color: #253047; }
    .report {
      width: 146mm;
      padding: 4mm;
      border: 0.25mm solid #23446b;
      background: #f0f6fa;
    }
    h1 { font-size: 17pt; color: #23446b; }
    p { margin: 0 0 4mm; }
    p.reference {
      box-sizing: border-box;
      width: 82mm;
      padding: 2mm;
      border: 0.25mm solid #23446b;
    }
    p.summary {
      box-sizing: border-box;
      width: 95mm;
      margin: 0 auto;
      padding: 3mm;
      border: 0.25mm solid #23446b;
      background: #dbeaf0;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="report">
    <h1>Service Report</h1>
    <p>Client: Example Facilities Pty Ltd</p>
    <p>Inspection: Water supply and safety checks completed.</p>
    <p class="reference">Reference: SR-2026-0142</p>
    <p>Action: Two follow-up items assigned for review.</p>
    <p class="summary">Outcome: Site inspection completed.</p>
  </section>
</body>
</html>
