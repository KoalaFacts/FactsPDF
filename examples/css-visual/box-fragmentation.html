<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Box fragment across three pages</title>
<style>
body { font-size:12pt; line-height:1.3; color:#222222; }
p { margin-top:0pt; margin-bottom:0pt; }
.spanning {
  width:445pt;
  padding:12pt;
  border:4pt solid #1d4568;
  background-color:#e7f2fa;
}
.marker { font-size:18pt; }
.next { break-before:page; }
</style></head><body>
<section class="spanning">
<p class="marker">Fragment one: first page</p>
<p>Background and border should belong to the same continuous box.</p>
<p class="next marker">Fragment two: middle page</p>
<p>The middle fragment must not repeat vertical padding and borders.</p>
<p class="next marker">Fragment three: final page</p>
<p>Side borders continue; only the last fragment receives a bottom edge.</p>
</section>
</body></html>
