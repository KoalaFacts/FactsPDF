<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline replaced elements reference</title>
<!-- Synthetic Chrome comparison fixture for img/svg in line boxes (docs/images.md#inline-images-in-line-boxes):
     a logo header with the default inline svg (the descender gap below it), the same logo with
     display:block, svgs inside a paragraph with every vertical-align keyword and a length, wrapping
     lines of icons, and translucent svg paint. Render with Arial (10pt) in Chrome and FactsPDF. -->
<style>
*{margin:0;padding:0}
body{font-family:Arial;font-size:10pt;line-height:1.2}
header{border-bottom:1px solid #2c323c}
p{margin:6pt 0}
.narrow{width:150pt}
</style>
</head>
<body>
<header><svg width="120" height="36" viewBox="0 0 120 36"><rect width="120" height="36" fill="#2c323c"/></svg></header>
<p>Text right below the inline logo header.</p>
<header><svg width="120" height="36" viewBox="0 0 120 36" style="display:block"><rect width="120" height="36" fill="#c8102e"/></svg></header>
<p>Text right below the display:block logo header.</p>
<p>Base <svg width="16" height="16"><rect width="16" height="16" fill="teal"/></svg>
middle <svg width="16" height="16" style="vertical-align:middle"><rect width="16" height="16" fill="teal"/></svg>
top <svg width="16" height="16" style="vertical-align:top"><rect width="16" height="16" fill="teal"/></svg>
bottom <svg width="16" height="16" style="vertical-align:bottom"><rect width="16" height="16" fill="teal"/></svg>
text-top <svg width="16" height="16" style="vertical-align:text-top"><rect width="16" height="16" fill="teal"/></svg>
text-bottom <svg width="16" height="16" style="vertical-align:text-bottom"><rect width="16" height="16" fill="teal"/></svg>
raised <svg width="16" height="16" style="vertical-align:4px"><rect width="16" height="16" fill="teal"/></svg> end.</p>
<p>Tall <svg width="24" height="48"><rect width="24" height="48" fill="navy"/></svg> middle <svg width="24" height="48" style="vertical-align:middle"><rect width="24" height="48" fill="navy"/></svg> line.</p>
<div class="narrow">Icons <svg width="40" height="20"><rect width="40" height="20" fill="orange"/></svg><svg width="40" height="20"><rect width="40" height="20" fill="green"/></svg><svg width="40" height="20"><rect width="40" height="20" fill="purple"/></svg><svg width="40" height="20"><rect width="40" height="20" fill="gold"/></svg> wrap as units across lines.</div>
<p><svg width="160" height="40" viewBox="0 0 160 40">
  <rect width="70" height="40" fill="#c8102e" fill-opacity="0.5"/>
  <rect x="80" width="70" height="40" fill="rgba(0, 0, 128, 0.4)" stroke="#2c323c" stroke-width="4" stroke-opacity="0.6"/>
  <g opacity="0.5"><circle cx="20" cy="20" r="8" fill="#000"/><circle cx="50" cy="20" r="8" fill="#000"/></g>
</svg></p>
</body>
</html>
