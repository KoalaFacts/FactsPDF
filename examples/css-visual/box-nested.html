<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nested percent width reference</title>
<style>
body { font-size:12pt; line-height:1.3; color:#222222; }
p { margin-top:0pt; margin-bottom:0pt; }
h1 { font-size:18pt; margin-top:0pt; margin-bottom:0pt; color:#1d4568; }
.outer { padding:12pt; border:2pt solid #1d4568; background-color:#dbeefa; }
.inner { width:70%; padding:10pt 16pt; border:2pt solid #008000; background-color:#e4c76a; }
.leaf { padding:7pt; background-color:#ffb27d; }
</style></head><body>
<section class="outer">
  <h1>Outer container</h1>
  <div class="inner">
    <p>Inner width seventy percent.</p>
    <article class="leaf"><p>Leaf content remains inside nested padding.</p></article>
  </div>
  <p>Following paragraph returns to outer content width.</p>
</section>
</body></html>
