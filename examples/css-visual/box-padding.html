<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Padding reference</title>
<style>
body { font-size:12pt; line-height:1.3; color:#222222; }
p { margin-top:0pt; margin-bottom:0pt; }
.outer {
  width:440pt;
  padding:12pt 28pt 24pt 36pt;
  background-color:#e4e5e7;
}
.inner {
  padding:8pt 12pt;
  background-color:#abd9e7;
}
</style></head><body>
<section class="outer">
  <div class="inner">
    <p>Padding top twelve and left thirty-six.</p>
    <p>Nested inner padding keeps the text away from every edge.</p>
  </div>
</section>
</body></html>
