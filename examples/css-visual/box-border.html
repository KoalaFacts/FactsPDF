<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Four border sides reference</title>
<style>
body { font-size:12pt; line-height:1.3; color:#202020; }
p { margin-top:0pt; margin-bottom:0pt; }
.frame {
  width:380pt;
  padding:16pt;
  border-top:6pt solid #aa2233;
  border-right:5pt solid #1d4568;
  border-bottom:4pt solid #008000;
  border-left:7pt solid #a0601c;
  background-color:#f1f4f6;
}
</style></head>
<body>
<div class="frame">
<p>Four sides must be independent.</p>
<p>Top red, right blue, bottom green, left orange.</p>
<p>All text remains searchable and inside the frame.</p>
</div>
</body></html>
