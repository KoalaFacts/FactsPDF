<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inspection and service report</title>
  <style>
    .report-card { width: 160pt; box-sizing: border-box; min-height: 90pt;
      border: 1pt solid #23446b; padding: 8pt; background: #edf5fa; margin: 4pt 0; }
    .summary { min-height: 1in; background: #f4f5f6; padding: 6pt; }
    h2 { font-size: 14pt; margin: 0 0 5pt; }
    p { margin: 0 0 4pt; font-size: 10pt; }
  </style>
</head>
<body>
  <h1>Service inspection</h1>
  <p>All reserved spaces below are actual PDF layout, not browser CSS placeholders.</p>
  <section class="report-card"><h2>Safety</h2><p>Checked and passed.</p></section>
  <section class="report-card"><h2>Maintenance</h2><p>Lubrication completed.</p></section>
  <section class="report-card"><h2>Operator</h2><p>Recorded by workshop.</p></section>
  <article class="summary"><h2>Conclusion</h2><p>Equipment is ready.</p></article>
</body>
</html>
