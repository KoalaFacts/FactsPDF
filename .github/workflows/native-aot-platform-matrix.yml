name: FactsPDF Native AOT platform matrix
# Publishes the CLI as Native AOT for each RID on a runner of that exact OS and
# architecture and runs the isolated-execution and feature-path verifiers on it.
# Linux x64 and Windows x64 are covered by the native-aot and windows-native-aot
# jobs in ci.yml. Release/publish steps are intentionally absent.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'examples/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'eng/**'
      - 'scripts/verify_native_aot.py'
      - 'scripts/test_native_aot.py'
      - 'scripts/verify_native_feature_paths.py'
      - 'scripts/test_native_feature_paths.py'
      - 'scripts/verify_sample.py'
      - 'scripts/png_fixtures.py'
      - '.github/workflows/native-aot-platform-matrix.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'examples/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'eng/**'
      - 'scripts/verify_native_aot.py'
      - 'scripts/test_native_aot.py'
      - 'scripts/verify_native_feature_paths.py'
      - 'scripts/test_native_feature_paths.py'
      - 'scripts/verify_sample.py'
      - 'scripts/png_fixtures.py'
      - '.github/workflows/native-aot-platform-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factspdf-native-aot-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-aot:
    name: native-aot ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-15
            exe: FactsPDF.Cli
          - rid: osx-x64
            # macos-13 (the last Intel image under that name) is retired; macos-15-intel is the Intel runner GitHub offers.
            os: macos-15-intel
            exe: FactsPDF.Cli
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            exe: FactsPDF.Cli
          - rid: win-arm64
            os: windows-11-arm
            exe: FactsPDF.Cli.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          architecture: ${{ runner.os == 'Windows' && 'arm64' || '' }}
      - name: Install independent PDF tools (Linux arm64, runner apt sources)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev poppler-utils qpdf
      - name: Install independent PDF tools (macOS, Homebrew)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install poppler qpdf
      - name: Install independent PDF tools (Windows arm64, signed MSYS2 CLANGARM64 repository)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-poppler mingw-w64-clang-aarch64-qpdf
      - name: Locate MSYS2 Poppler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION 'clangarm64\bin'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          # Git for Windows' bash re-prepends its own clangarm64\bin (an old xpdf-style
          # pdftotext) ahead of GITHUB_PATH entries, so bash steps prepend this explicitly.
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FACTSPDF_MSYS2_BIN=$bin"
      - name: Record toolchain and tool versions
        run: |
          if [ -n "${FACTSPDF_MSYS2_BIN:-}" ]; then export PATH="$(cygpath -u "$FACTSPDF_MSYS2_BIN"):$PATH"; fi
          mkdir -p artifacts
          { dotnet --info; python --version; uname -a || true; pdfinfo -v 2>&1 || true; qpdf --version || true; } | tee artifacts/toolchain-${{ matrix.rid }}.txt
      - name: Publish a real Native AOT executable
        run: dotnet publish src/FactsPDF.Cli/FactsPDF.Cli.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/native 2>&1 | tee artifacts/publish-${{ matrix.rid }}.log
      - name: Verify build identity
        run: |
          expected="FactsPDF.Cli 0.1.0-preview.1+$(git rev-parse HEAD)"
          actual="$(artifacts/native/${{ matrix.exe }} --version | tr -d '\r')"
          test "$actual" = "$expected" || { echo "Native AOT CLI build identity mismatch on ${{ matrix.rid }}: $actual" >&2; exit 1; }
      - name: Run the isolated native executable and inspect two-page PDF and error recovery
        run: |
          if [ -n "${FACTSPDF_MSYS2_BIN:-}" ]; then export PATH="$(cygpath -u "$FACTSPDF_MSYS2_BIN"):$PATH"; fi
          pdftotext -v 2>&1 | grep -qi poppler || { echo "pdftotext on PATH is not Poppler: $(command -v pdftotext)" >&2; exit 1; }
          python -m unittest discover -s scripts -p test_native_aot.py -v
          python scripts/verify_native_aot.py --rid ${{ matrix.rid }} --executable artifacts/native/${{ matrix.exe }} --output artifacts/native-aot-evidence
      - name: Exercise real Native AOT furniture, long-row and report feature paths
        run: |
          if [ -n "${FACTSPDF_MSYS2_BIN:-}" ]; then export PATH="$(cygpath -u "$FACTSPDF_MSYS2_BIN"):$PATH"; fi
          python -m unittest discover -s scripts -p test_native_feature_paths.py -v
          python scripts/verify_native_feature_paths.py --executable artifacts/native/${{ matrix.exe }} --output artifacts/native-feature-evidence
      - name: Retain Native AOT acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-aot-evidence-${{ matrix.rid }}
          path: |
            artifacts/native-aot-evidence/
            artifacts/native-feature-evidence/
            artifacts/toolchain-${{ matrix.rid }}.txt
            artifacts/publish-${{ matrix.rid }}.log
          if-no-files-found: warn
          retention-days: 7
