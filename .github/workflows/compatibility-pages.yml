name: Compatibility site · Purity npm · GitHub Pages
on:
  pull_request:
    paths: ['site/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      index-sha256: ${{ steps.site-identity.outputs.index }}
      data-sha256: ${{ steps.site-identity.outputs.data }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact npm dependency graph
        run: npm ci
      - name: Validate snapshot and test model
        run: npm test
      - name: Compile Purity templates and build static site
        run: npm run build
      - name: Install real Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise search, filters, navigation, details and responsive layout
        run: npm run test:browser
      - name: Record tested site identity
        id: site-identity
        run: |
          echo "index=$(sha256sum dist/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "data=$(sha256sum dist/data/compatibility.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain site test evidence (never node_modules or browsers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-site-review
          path: |
            site/test-results/
            site/dist/
            site/package-lock.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published entrypoint, data and assets
        timeout-minutes: 3
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_INDEX: ${{ needs.verify-build.outputs.index-sha256 }}
          EXPECTED_DATA: ${{ needs.verify-build.outputs.data-sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const base = new URL(process.env.PAGES_URL);
          assert.equal(base.href, 'https://koalafacts.github.io/FactsPDF/');
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          async function get(path) {
            const url = new URL(path, base);
            assert.equal(url.origin, base.origin);
            assert.ok(url.pathname.startsWith(base.pathname));
            const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(10000) });
            assert.equal(response.status, 200, `${url.pathname}: HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const html = await get('./');
              assert.equal(sha256(html), process.env.EXPECTED_INDEX, 'published HTML differs from tested build');
              const data = await get('data/compatibility.json');
              assert.equal(sha256(data), process.env.EXPECTED_DATA, 'published support data differs from tested build');
              JSON.parse(data.toString('utf8'));
              const assets = [...html.toString('utf8').matchAll(/(?:src|href)="([^" ]+\.(?:js|css))"/g)].map(match => match[1]);
              assert.ok(assets.some(path => path.endsWith('.js')), 'built JavaScript entry is missing');
              assert.ok(assets.some(path => path.endsWith('.css')), 'built stylesheet is missing');
              for (const asset of assets) {
                assert.ok(new URL(asset, base).pathname.startsWith('/FactsPDF/assets/'), 'uncompiled asset path');
                assert.ok((await get(asset)).length > 0, 'empty asset response');
              }
              console.log(`Verified published HTML/data SHA256 and ${assets.length} compiled assets at ${base.href}`);
              break;
            } catch (error) {
              if (attempt === 6) throw error;
              console.warn(`Pages propagation check ${attempt}/6: ${error.message}`);
              await delay(5000);
            }
          }
          NODE
