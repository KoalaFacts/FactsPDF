name: Compatibility site · Purity npm · GitHub Pages
on:
  pull_request:
    paths: ['site/**', '.github/workflows/compatibility-pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/compatibility-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact npm dependency graph
        run: npm ci
      - name: Validate snapshot and test model
        run: npm test
      - name: Compile Purity templates and build static site
        run: npm run build
      - name: Install real Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise search, filters, navigation, details and responsive layout
        run: npm run test:browser
      - name: Retain site test evidence (never node_modules or browsers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-site-review
          path: |
            site/test-results/
            site/dist/
            site/package-lock.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
