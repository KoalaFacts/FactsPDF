name: FactsPDF CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: factspdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test FactsPDF.slnx -c Release --logger "console;verbosity=normal"
  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install native compiler and independent verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y clang zlib1g-dev poppler-utils qpdf fonts-droid-fallback fonts-dejavu-core python3-fonttools
      - name: Publish a real Native AOT executable
        run: dotnet publish src/FactsPDF.Cli/FactsPDF.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/native
      - name: Verify original ASCII output
        run: |
          file artifacts/native/FactsPDF.Cli
          artifacts/native/FactsPDF.Cli examples/first-document.html artifacts/first-document.pdf
          python3 scripts/verify_sample.py artifacts/first-document.pdf
      - name: Verify actual Chinese fonts, searchable text and rendered pages
        run: |
          dpkg-query -W fonts-droid-fallback fonts-dejavu-core python3-fonttools
          test -f /usr/share/doc/fonts-droid-fallback/copyright
          /usr/bin/python3 scripts/verify_unicode.py artifacts/native/FactsPDF.Cli --emit-base64
      - name: Build package for license inspection only, without publishing
        run: |
          dotnet pack src/FactsPDF/FactsPDF.csproj -c Release -o artifacts/packages
          python3 scripts/verify_package.py
          python3 -c "import glob,zipfile; p=glob.glob('artifacts/packages/*.nupkg'); assert p; assert all(not n.lower().endswith(('.ttf','.otf','.ttc','.woff','.woff2')) for f in p for n in zipfile.ZipFile(f).namelist()); print('No font files packaged.')"
