          assert manifest['sourceHead'] == source
          assert identity['profile'] == 'local-linux'
          assert identity['version'] == '0.1.0-preview.1'
          assert identity['sdkVersion'] == '10.0.402'
          assert identity['managedRuntimeVersion'] == '10.0.13'
