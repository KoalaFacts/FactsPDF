            dotnet build tools/FactsPDF.PackageInspector/FactsPDF.PackageInspector.csproj --no-restore -c Release -p:SourceRevisionId="$source_head" -p:ContinuousIntegrationBuild=true -p:RuntimeFrameworkVersion=10.0.13
