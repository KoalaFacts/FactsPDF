      - name: Seal independently verified private software for offline owner retention
        # PR checks exercise sealing, but never upload even the encrypted bytes.
        # Only a successful main build may retain transport ciphertext.
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/factspdf-private-five-staged/candidate-manifest.json"
          test -s "$RUNNER_TEMP/factspdf-private-five-verification/payload-verification.json"
          openssl x509 -in eng/private-candidate-transport.crt -noout -checkend 0
          trap 'rm -f "$RUNNER_TEMP/factspdf-private-transient.tar.gz"' EXIT
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          staged = root / 'factspdf-private-five-staged'
          evidence = root / 'factspdf-private-five-verification'
