name: FactsPDF CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: factspdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify Node subprocess boundary without renderer dependencies
        run: node --test scripts/test_node_cli_process.mjs
      - run: dotnet test FactsPDF.slnx -c Release --logger "console;verbosity=normal"
  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Gate private candidate source and inspector inputs before build
        run: |
          python3 -m unittest discover -s scripts -p 'test_stage_delivery_candidate.py' -v
          python3 scripts/stage_delivery_candidate.py preflight --profile local-linux --output "$RUNNER_TEMP/factspdf-candidate-preflight"
      - name: Verify Ubuntu package source isolation without network
        run: python3 -m unittest discover -s scripts -p 'test_ubuntu_packages.py' -v
      - name: Install native compiler and independent verification tools
        run: python3 scripts/ubuntu_packages.py packages clang zlib1g-dev poppler-utils qpdf fonts-droid-fallback fonts-dejavu-core python3-fonttools
      - name: Publish a real Native AOT executable
        run: dotnet publish src/FactsPDF.Cli/FactsPDF.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/native
      - name: Probe Node integration with the actual Native AOT CLI
        env:
          FACTSPDF_CLI: ${{ github.workspace }}/artifacts/native/FactsPDF.Cli
          FACTSPDF_PROBE_FONTS: '["/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf","/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf"]'
        run: node --test scripts/test_node_cli_integration.mjs
      - name: Verify original ASCII output
        run: |
          file artifacts/native/FactsPDF.Cli
          artifacts/native/FactsPDF.Cli examples/first-document.html artifacts/first-document.pdf
          python3 scripts/verify_sample.py artifacts/first-document.pdf
      - name: Verify actual Chinese fonts, searchable text and rendered pages
        run: |
          dpkg-query -W fonts-droid-fallback fonts-dejavu-core python3-fonttools
          test -f /usr/share/doc/fonts-droid-fallback/copyright
          /usr/bin/python3 scripts/verify_unicode.py artifacts/native/FactsPDF.Cli
      - name: Exercise real Linux Native AOT furniture and long-row paths
        run: |
          python3 -m unittest discover -s scripts -p 'test_native_feature_paths.py' -v
          python3 scripts/verify_native_feature_paths.py --executable artifacts/native/FactsPDF.Cli --output artifacts/linux-native-feature-evidence
      - name: Retain Linux Native AOT feature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native-feature-evidence
          path: artifacts/linux-native-feature-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Build local package for metadata and first-use verification, without publishing
        run: |
          rm -rf src/FactsPDF/bin src/FactsPDF/obj src/FactsPDF.Cli/bin src/FactsPDF.Cli/obj
          dotnet pack src/FactsPDF/FactsPDF.csproj -c Release -o artifacts/packages
          dotnet build tools/FactsPDF.PackageInspector/FactsPDF.PackageInspector.csproj -c Release -o artifacts/package-inspector
          python3 scripts/verify_package.py --assembly-inspector artifacts/package-inspector/FactsPDF.PackageInspector.dll
          python3 scripts/verify_package_inspector.py --assembly-inspector artifacts/package-inspector/FactsPDF.PackageInspector.dll
          python3 -c "import glob,zipfile; p=glob.glob('artifacts/packages/*.nupkg'); assert p; assert all(not n.lower().endswith(('.ttf','.otf','.ttc','.woff','.woff2')) for f in p for n in zipfile.ZipFile(f).namelist()); print('No font files packaged.')"
      - name: Verify clean external CLI and NuGet first use
        run: |
          python3 -m unittest discover -s scripts -p 'test_candidate_assets.py' -v
          python3 -m unittest discover -s scripts -p 'test_package_contract.py' -v
          python3 -m unittest discover -s scripts -p 'test_declared_package_contract.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_toolchain.py' -v
          python3 -m unittest discover -s scripts -p 'test_consumer_target.py' -v
          python3 -m unittest discover -s scripts -p 'test_exact_consumer_probe.py' -v
          python3 -m unittest discover -s scripts -p 'test_first_use.py' -v
          dotnet publish src/FactsPDF.Cli/FactsPDF.Cli.csproj -c Release --no-self-contained -o artifacts/first-use-cli
          python3 scripts/verify_first_use.py --cli-dll artifacts/first-use-cli/FactsPDF.Cli.dll --dotnet "$(command -v dotnet)" --output artifacts/first-use
      - name: Build private Linux candidate inputs from the pinned clean source (not a release)
        run: |
          python3 scripts/stage_delivery_candidate.py build --profile local-linux --output "$RUNNER_TEMP/factspdf-private-build"
          test -s "$RUNNER_TEMP/factspdf-private-build/private-build.json"
          cp "$RUNNER_TEMP/factspdf-private-build/private-build.json" artifacts/first-use/private-build.json
          python3 -c "import json; p=json.load(open('artifacts/first-use/private-build.json')); assert p['candidateBuilt'] and not p['candidateAssembled'] and not p['independentlyValidated'] and not p['published']"
      - name: Assemble and independently exercise extracted private managed CLI software
        run: |
          python3 -m unittest discover -s scripts -p 'test_private_managed_archive.py' -v
          python3 scripts/stage_delivery_candidate.py assemble-managed --build "$RUNNER_TEMP/factspdf-private-build" --output "$RUNNER_TEMP/factspdf-private-managed"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          folder = root / 'factspdf-private-managed'
          report = json.loads((folder / 'managed-archive.json').read_text())
          archive = folder / report['archive']['filename']
          allowed = {'FactsPDF.Cli/' + name for name in (
              'FactsPDF.Cli.dll', 'FactsPDF.dll', 'FactsPDF.Cli.deps.json',
              'FactsPDF.Cli.runtimeconfig.json', 'LICENSE.md', 'CLI-README.md')}
          assert report['candidateAssembled'] is False and report['independentlyValidated'] is False
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == report['archive']['sha256']
          extraction = root / 'factspdf-private-managed-extracted'
          extraction.mkdir()
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              assert len(members) == len(allowed)
              assert {m.filename for m in members} == allowed
              assert all((m.external_attr >> 16) & 0o170000 == 0o100000 for m in members)
              assert z.testzip() is None
              assert {m['path'] for m in report['members']} == allowed
              for m in members:
                  data = z.read(m)
                  expected, = [x for x in report['members'] if x['path'] == m.filename]
                  assert len(data) == expected['bytes'] and hashlib.sha256(data).hexdigest() == expected['sha256']
              z.extractall(extraction)
          assert (extraction / 'FactsPDF.Cli/LICENSE.md').read_bytes() == pathlib.Path('LICENSE.md').read_bytes()
          print('Exact six-member managed software ZIP extracted outside source, inventory and LICENSE confirmed')
          PY
          python3 scripts/verify_release_candidate.py \
            --cli-dll "$RUNNER_TEMP/factspdf-private-managed-extracted/FactsPDF.Cli/FactsPDF.Cli.dll" \
            --package "$RUNNER_TEMP/factspdf-private-build/packages/FactsPDF.0.1.0-preview.1.nupkg" \
            --expected-sdk 10.0.402 --expected-runtime 10.0.13 \
            --dotnet "$(command -v dotnet)" --output "$RUNNER_TEMP/factspdf-private-managed-first-use"
          cp "$RUNNER_TEMP/factspdf-private-managed/managed-archive.json" artifacts/first-use/private-managed-archive.json
          cp "$RUNNER_TEMP/factspdf-private-managed-first-use/report.json" artifacts/first-use/private-managed-first-use.json
      - name: Independently install and run the source-bound private examples ZIP
        run: |
          python3 -m unittest discover -s scripts -p 'test_private_examples_payload.py' -v
          python3 scripts/stage_delivery_candidate.py assemble-examples --output "$RUNNER_TEMP/factspdf-private-examples"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          folder = runner / 'factspdf-private-examples'
          report = json.loads((folder / 'examples-archive.json').read_text())
          build = json.loads((runner / 'factspdf-private-build/private-build.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['sourceHead'] == build['sourceHead'] == head
          assert report['version'] == '0.1.0-preview.1'
          assert report['candidateAssembled'] is False and report['independentlyValidated'] is False
          assert report['published'] is False and report['distributionAuthorized'] is False
          archive = folder / report['archive']['filename']
          assert archive.name == 'FactsPDF.0.1.0-preview.1.examples.zip'
          assert archive.stat().st_size == report['archive']['bytes'] <= 4 * 1024 * 1024
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == report['archive']['sha256']
          allowed = {'FactsPDF.Examples/' + p for p in (
              'first-use/FirstUse.csproj', 'first-use/Program.cs', 'first-use/NuGet.Config',
              'first-use/input.html', 'first-use/unsupported.html',
              'first-use/expected-pages.json', 'global.json', 'LICENSE.md',
              'README.md', 'EXAMPLES-MANIFEST.json')}
          extracted = runner / 'factspdf-private-examples-extracted'
          extracted.mkdir()
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) == len(allowed)
              assert {item.filename for item in entries} == allowed
              assert z.testzip() is None
              files = {}
              for item in entries:
                  assert item.create_system == 3 and item.external_attr >> 16 == 0o100644
                  assert item.file_size <= 1024 * 1024 and not (item.flag_bits & 1)
                  data = z.read(item)
                  assert len(data) == item.file_size
                  files[item.filename] = data
                  target = extracted / item.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          assert {'FactsPDF.Examples/' + item['path'] for item in report['members']} == allowed
          for item in report['members']:
              data = files['FactsPDF.Examples/' + item['path']]
              assert len(data) == item['bytes']
              assert hashlib.sha256(data).hexdigest() == item['sha256']
          manifest = json.loads(files['FactsPDF.Examples/EXAMPLES-MANIFEST.json'])
          assert manifest['sourceHead'] == head and manifest['version'] == report['version']
          assert manifest['generatedMembers'] == ['EXAMPLES-MANIFEST.json']
          assert {'FactsPDF.Examples/' + rec['path'] for rec in manifest['trackedMembers']} == allowed - {'FactsPDF.Examples/EXAMPLES-MANIFEST.json'}
          for rec in manifest['trackedMembers']:
              payload = files['FactsPDF.Examples/' + rec['path']]
              assert len(payload) == rec['bytes']
              assert hashlib.sha256(payload).hexdigest() == rec['sha256']
              assert subprocess.check_output(['git', 'cat-file', 'blob',
                  head + ':' + rec['sourcePath']]) == payload
          assert files['FactsPDF.Examples/LICENSE.md'] == pathlib.Path('LICENSE.md').read_bytes()
          assert files['FactsPDF.Examples/global.json'] == pathlib.Path('global.json').read_bytes()
          package = runner / 'factspdf-private-build/packages/FactsPDF.0.1.0-preview.1.nupkg'
          record, = (rec for rec in build['files'] if rec['path'] == 'packages/' + package.name)
          assert package.stat().st_size == record['bytes']
          assert hashlib.sha256(package.read_bytes()).hexdigest() == record['sha256']
          assert not (extracted / 'FactsPDF.Examples/.git').exists()
          print('Real examples ZIP extracted outside checkout; committed example bytes, package source, license and budgets match')
          PY
          python3 scripts/verify_release_candidate.py \
            --cli-dll "$RUNNER_TEMP/factspdf-private-managed-extracted/FactsPDF.Cli/FactsPDF.Cli.dll" \
            --package "$RUNNER_TEMP/factspdf-private-build/packages/FactsPDF.0.1.0-preview.1.nupkg" \
            --consumer-source "$RUNNER_TEMP/factspdf-private-examples-extracted/FactsPDF.Examples/first-use" \
            --expected-sdk 10.0.402 --expected-runtime 10.0.13 \
            --dotnet "$(command -v dotnet)" \
            --output "$RUNNER_TEMP/factspdf-private-examples-first-use"
          cp "$RUNNER_TEMP/factspdf-private-examples/examples-archive.json" artifacts/first-use/private-examples-archive.json
          cp "$RUNNER_TEMP/factspdf-private-examples-first-use/report.json" artifacts/first-use/private-examples-installed-first-use.json
      - name: Assemble and independently exercise extracted private Linux Native AOT software
        run: |
          python3 -m unittest discover -s scripts -p 'test_private_native_archive.py' -v
          python3 scripts/stage_delivery_candidate.py assemble-native --build "$RUNNER_TEMP/factspdf-private-build" --output "$RUNNER_TEMP/factspdf-private-native"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          folder = root / 'factspdf-private-native'
          report = json.loads((folder / 'native-archive.json').read_text())
          assert report['identity']['profile'] == 'local-linux'
          assert not any(report[k] for k in ('candidateAssembled', 'independentlyValidated',
                                             'published', 'distributionAuthorized'))
          archive = folder / report['archive']['filename']
          assert archive.name == 'FactsPDF.Cli.0.1.0-preview.1.native-linux-x64.zip'
          assert archive.stat().st_size == report['archive']['bytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == report['archive']['sha256']
          allowed = {'FactsPDF.Native/FactsPDF.Cli', 'FactsPDF.Native/LICENSE.md',
                     'FactsPDF.Native/CLI-README.md',
                     'FactsPDF.Native/notices/dotnet/LICENSE.TXT',
                     'FactsPDF.Native/notices/dotnet/THIRD-PARTY-NOTICES.TXT'}
          assert len(report['members']) == 5 and {r['path'] for r in report['members']} == allowed
          build = json.loads((root / 'factspdf-private-build/private-build.json').read_text())
          assert report['nativeNoticeOrigin'] == build['nativeNoticeOrigin']
          # Independently bind resolved ILCompiler packages to the source
          # assets that the actual native publish left in the checkout.
          compiler = report['nativeCompilerOrigin']
          assert compiler == build['nativeCompilerOrigin']
          assert build['nativeCompilerPackVerified'] is False
          assert compiler['officialSignatureVerified'] is False
          assert compiler['projectAssetsSha256'] == hashlib.sha256(
              pathlib.Path('src/FactsPDF.Cli/obj/project.assets.json').read_bytes()).hexdigest()
          assert [p['packageId'] for p in compiler['packages']] == [
              'Microsoft.DotNet.ILCompiler',
              'runtime.linux-x64.Microsoft.DotNet.ILCompiler']
          assert all(p['version'] == '10.0.13' for p in compiler['packages'])
          pinned = {'LICENSE.TXT': 'cfc21f5e8bd655ae997eec916138b707b1d290b83272c02a95c9f821b8c87310',
                    'THIRD-PARTY-NOTICES.TXT': '66f1d4e44973185519bb4aa8a9718eb22fc7af2cc532e3ae9cfc4c127ee7fc54'}
          assert {n['filename']: n['sha256'] for n in build['nativeNoticeOrigin']['notices']} == pinned
          extracted = root / 'factspdf-private-native-extracted'
          extracted.mkdir()
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              assert len(infos) == 5 and {i.filename for i in infos} == allowed
              assert z.testzip() is None
              for item in infos:
                  expected, = [r for r in report['members'] if r['path'] == item.filename]
                  payload = z.read(item)
                  assert len(payload) == expected['bytes']
                  assert hashlib.sha256(payload).hexdigest() == expected['sha256']
                  mode = 0o100755 if item.filename.endswith('/FactsPDF.Cli') else 0o100644
                  assert item.create_system == 3 and item.external_attr >> 16 == mode
                  destination = extracted / item.filename
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(payload)
                  destination.chmod(mode & 0o777)
          native = extracted / 'FactsPDF.Native/FactsPDF.Cli'
          build = json.loads((root / 'factspdf-private-build/private-build.json').read_text())
          record, = [r for r in build['files'] if r['path'] == 'native/FactsPDF.Cli']
          assert native.read_bytes()[:4] == b'\x7fELF'
          assert hashlib.sha256(native.read_bytes()).hexdigest() == record['sha256']
          assert (extracted / 'FactsPDF.Native/LICENSE.md').read_bytes() == pathlib.Path('LICENSE.md').read_bytes()
          for name, digest in pinned.items():
              assert hashlib.sha256((extracted / 'FactsPDF.Native/notices/dotnet' / name).read_bytes()).hexdigest() == digest
          print('Real private Linux native software ZIP: extracted executable, original license, target-pack notices, source SHA and mode verified')
          PY
          python3 scripts/verify_native_feature_paths.py \
            --executable "$RUNNER_TEMP/factspdf-private-native-extracted/FactsPDF.Native/FactsPDF.Cli" \
            --output "$RUNNER_TEMP/factspdf-private-native-feature-evidence"
          cp "$RUNNER_TEMP/factspdf-private-native/native-archive.json" artifacts/first-use/private-native-archive.json
          cp "$RUNNER_TEMP/factspdf-private-native-feature-evidence/report.json" artifacts/first-use/private-native-feature-report.json
      - name: Assemble and independently extract actual corresponding-source delivery payload
        run: |
          python3 -m unittest discover -s scripts -p 'test_private_source_payload.py' -v
          python3 scripts/stage_delivery_candidate.py assemble-source --output "$RUNNER_TEMP/factspdf-private-source"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          folder = root / 'factspdf-private-source'
          receipt = json.loads((folder / 'source-archive.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert receipt['sourceHead'] == head
          assert receipt['archive']['filename'] == 'FactsPDF.0.1.0-preview.1.source.tar.gz'
          assert not any(receipt[key] for key in (
              'candidateAssembled', 'independentlyValidated', 'published',
              'distributionAuthorized'))
          archive = folder / receipt['archive']['filename']
          assert archive.stat().st_size == receipt['archive']['bytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == receipt['archive']['sha256']
          prefix = 'FactsPDF.0.1.0-preview.1.source/'
          extracted = root / 'factspdf-private-source-extracted'
          extracted.mkdir()
          # Incrementally bound decompression and TAR-header traversal. Never
          # call getmembers() before enforcing the 513-entry safety limit.
          with tarfile.open(archive, 'r|gz') as stream:
              files = {}
              count = 0
              total = 0
              for item in stream:
                  count += 1
                  assert count <= 513, 'Source TAR entry-count budget'
                  if count == 1:
                      assert item.isdir() and item.name == prefix.rstrip('/')
                      continue
                  assert item.isfile() and not item.issym() and not item.islnk()
                  assert item.name.startswith(prefix)
                  relative = item.name[len(prefix):]
                  assert relative and all(p not in ('', '.', '..') for p in relative.split('/'))
                  assert '\\' not in relative and ':' not in relative and relative not in files
                  assert 0 < item.size <= 8 * 1024 * 1024 and item.mode == 0o644
                  total += item.size
                  assert total <= 64 * 1024 * 1024, 'Source TAR expanded-byte budget'
                  payload = stream.extractfile(item).read()
                  assert len(payload) == item.size
                  files[relative] = payload
                  target = extracted / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
              assert 60 < count <= 513
          assert {r['path'] for r in receipt['members']} == set(files)
          for rec in receipt['members']:
              payload = files[rec['path']]
              assert len(payload) == rec['bytes'] and hashlib.sha256(payload).hexdigest() == rec['sha256']
          assert files['LICENSE.md'] == pathlib.Path('LICENSE.md').read_bytes()
          assert files['global.json'] == pathlib.Path('global.json').read_bytes()
          assert files['Directory.Build.props'] == pathlib.Path('Directory.Build.props').read_bytes()
          assert files['shared/PageFurnitureJson.cs'] == pathlib.Path('shared/PageFurnitureJson.cs').read_bytes()
          assert 'src/FactsPDF.Cli/FactsPDF.Cli.csproj' in files
          assert 'src/FactsPDF/FactsPDF.csproj' in files
          assert 'examples/first-use/FirstUse.csproj' in files
          manifest = json.loads(files['SOURCE-MANIFEST.json'])
          assert manifest['sourceHead'] == head and manifest['packageVersion'] == '0.1.0-preview.1'
          assert manifest['generatedMembers'] == ['SOURCE-BUILD.md', 'SOURCE-MANIFEST.json']
          expected = {r['path'] for r in manifest['trackedMembers']}
          assert expected == set(files) - set(manifest['generatedMembers'])
          for rec in manifest['trackedMembers']:
              path = rec['path']
              payload = files[path]
              assert len(payload) == rec['bytes']
              assert hashlib.sha256(payload).hexdigest() == rec['sha256']
              actual_git = subprocess.check_output(['git', 'cat-file', 'blob', head + ':' + path])
              assert payload == actual_git
          assert head.encode() in files['SOURCE-BUILD.md']
          assert not any(name.startswith(('.git', 'bin/', 'obj/')) or name.endswith(
              ('.ttf', '.otf', '.pdf', '.pdb', '.dll', '.exe')) for name in files)
          print('Independent source payload extraction, exact Git bytes, build closure, license and budgets verified')
          PY
          cp "$RUNNER_TEMP/factspdf-private-source/source-archive.json" artifacts/first-use/private-source-archive.json
      - name: Rebuild independently extracted corresponding source offline and execute its CLI
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/factspdf-private-source-extracted"
          test -f "$source_root/SOURCE-MANIFEST.json"
          test ! -e "$source_root/.git"
          source_head="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceHead"])' "$source_root/SOURCE-MANIFEST.json")"
          test "$source_head" = "$(git rev-parse HEAD)"
          test "$(dotnet --version)" = "10.0.402"
          offline_config="$RUNNER_TEMP/factspdf-private-source-nuget.config"
          source_feed="$RUNNER_TEMP/factspdf-private-source-feed"
          mkdir -p "$RUNNER_TEMP/factspdf-private-source-packages" "$source_feed"
          # SDK 10.0.402 requires the pinned ILLink.Tasks 10.0.13 package.
          # Copy only its hashed NuGet archive from the earlier clean build into
          # a local feed; never restore from checkout outputs or the network.
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, shutil
          cache = pathlib.Path.home() / '.nuget/packages/microsoft.net.illink.tasks/10.0.13'
          archive = cache / 'microsoft.net.illink.tasks.10.0.13.nupkg'
          digest_file = cache / 'microsoft.net.illink.tasks.10.0.13.nupkg.sha512'
          for path in (archive, digest_file):
              if not path.is_file() or path.is_symlink() or not path.stat().st_size:
                  raise AssertionError('Missing/invalid pinned ILLink package cache member: ' + str(path))
          digest = hashlib.sha512()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          actual = base64.b64encode(digest.digest()).decode('ascii')
          if actual != digest_file.read_text(encoding='ascii').strip():
              raise AssertionError('ILLink package archive differs from recorded NuGet cache SHA512')
          shutil.copyfile(archive, pathlib.Path(os.environ['RUNNER_TEMP']) / 'factspdf-private-source-feed' / archive.name)
          print('Pinned ILLink.Tasks 10.0.13 archive checksum verified for offline extracted-source restore')
          PY
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration><packageSources><clear /><add key="verified-local" value="'"$source_feed"'" /></packageSources></configuration>' > "$offline_config"
