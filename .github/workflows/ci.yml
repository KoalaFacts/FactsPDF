          assert (root / 'factspdf-staged-examples-extracted/FactsPDF.Examples/LICENSE.md').read_bytes() == pathlib.Path('LICENSE.md').read_bytes()
          print('All five staged software bytes, frozen archive allowlists, source identity, notices and executable modes checked independently')
          PY
          # Use the exact freshly compiled, receipt-bound PackageInspector on the
