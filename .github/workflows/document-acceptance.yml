name: FactsPDF document acceptance candidate evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factspdf-document-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FACTSPDF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Install explicit verification tools and trusted fixture fonts
        run: python3 scripts/ubuntu_packages.py packages clang time zlib1g-dev qpdf poppler-utils python3-pil python3-fonttools python3-pypdf p7zip-full fonts-dejavu-core fonts-droid-fallback
      - name: Test new acceptance machinery without network or real fonts
        run: /usr/bin/python3 -m unittest discover -s scripts -p 'test_acceptance_*.py' -v
      - name: Test reading-sample text integrity
        run: /usr/bin/python3 -m unittest discover -s scripts -p 'test_operations_report.py' -v
      - name: Generate deterministic candidate corpus (not approved references)
        run: |
          /usr/bin/python3 scripts/acceptance_corpus.py generate artifacts/acceptance-inputs
          /usr/bin/python3 scripts/acceptance_corpus.py validate artifacts/acceptance-inputs/manifest.json
      - name: Build actual Native AOT CLI and public-API acceptance host
        run: |
          /usr/bin/python3 scripts/acceptance_build.py --cli-output artifacts/acceptance-cli --host-output artifacts/acceptance-host
      - name: Capture real candidates and raw performance evidence; no human approval implied
        run: |
          /usr/bin/python3 scripts/acceptance_run.py capture \
            --manifest artifacts/acceptance-inputs/manifest.json \
            --native-cli artifacts/acceptance-cli/FactsPDF.Cli \
            --api-host artifacts/acceptance-host/FactsPDF.Acceptance \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --font /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf \
            --reviews docs/acceptance/reference-reviews.json \
            --measure --output artifacts/document-acceptance
      - name: Check candidate reading space and original slice borders
        run: /usr/bin/python3 scripts/acceptance_reading_space.py artifacts/document-acceptance/public artifacts/document-acceptance/public/reading-space.json
      - name: Calibrate supplemental process peaks without rewriting old measurements
        run: |
          /usr/bin/python3 scripts/acceptance_peak.py collect \
            --manifest artifacts/acceptance-inputs/manifest.json \
            --capture artifacts/document-acceptance/public \
            --cli artifacts/acceptance-cli/FactsPDF.Cli \
            --host artifacts/acceptance-host/FactsPDF.Acceptance \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --font /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf \
            --work artifacts/acceptance-peak \
            --output artifacts/document-acceptance/public/peak-calibration.json
      - name: Capture operations report through Native CLI, public API and real Chrome
        run: |
          /usr/bin/python3 scripts/capture_operations_report.py \
            --cli artifacts/acceptance-cli/FactsPDF.Cli \
            --host artifacts/acceptance-host/FactsPDF.Acceptance \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --font /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf \
            --output artifacts/operations-report
      - name: Verify actual styled-CJK business reports via .NET, managed CLI and Linux Native AOT
        run: |
          # The existing pinned font helper verifies the original 1.0.42 archive and
          # eight independent regular/bold/italic/bold-italic file hashes and outlines.
          # Fonts stay in runner temp; never upload them or an unapproved PDF.
          /usr/bin/python3 scripts/font_style_fonts.py \
            --sarasa-root "$RUNNER_TEMP/factspdf-sarasa" \
            --latin-root /usr/share/fonts/truetype/dejavu \
            --download --output "$RUNNER_TEMP/factspdf-font-manifest.json"
          dotnet build src/FactsPDF.Cli/FactsPDF.Cli.csproj -c Release
          dotnet build probes/combined-report/FactsPDF.CombinedReport.csproj -c Release
          /usr/bin/python3 -m unittest discover -s scripts -p 'test_combined_report.py' -v
          /usr/bin/python3 scripts/verify_combined_report.py \
            --manifest "$RUNNER_TEMP/factspdf-font-manifest.json" \
            --output "$RUNNER_TEMP/factspdf-combined-report" \
            --dotnet "$(command -v dotnet)" \
            --cli-dll src/FactsPDF.Cli/bin/Release/net10.0/FactsPDF.Cli.dll \
            --api-dll probes/combined-report/bin/Release/net10.0/FactsPDF.CombinedReport.dll \
            --native-cli artifacts/acceptance-cli/FactsPDF.Cli
          /usr/bin/python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import os
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'factspdf-combined-report' / 'report.json').read_text())
          assert len(data['cases']) == 7 and data['positivePages'] == 10 and data['allGeneratedVariantPages'] == 22
          assert all(case['apiCliNativeBytesEqual'] for case in data['cases'])
          assert data['approvals']['newCombinationApproval'] == 'pending-user-review'
          print('### Styled-CJK report engineering acceptance')
          print('Pinned original four-role Latin/CJK fonts: SHA and distinct outlines checked.')
          print('10/30/100-record reports and variants: 7 native/API/managed-equivalent cases, 22 pages.')
          print('Original unapproved pages and legal/customer permissions remain pending.')
          print('Full PDFs and font inputs are kept in runner temp, not uploaded.')
          PY
      - name: Retain operations report review evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-report-review
          path: artifacts/operations-report/public/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact incomplete-state summary
        if: always()
        run: |
          if test -f artifacts/document-acceptance/public/report.md; then
            cat artifacts/document-acceptance/public/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Candidate evidence failed before completion. No reviewed baseline or preview approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain only the explicit public evidence allowlist
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-acceptance-candidates
          path: artifacts/document-acceptance/public/
          if-no-files-found: error
          retention-days: 14
